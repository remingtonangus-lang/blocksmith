name: capital
# Alabaster (game/, Godot 4): headless tests + screenshot shots on Linux (xvfb + Mesa lavapipe Vulkan), and an
# ad-hoc-signed Apple Silicon .app exported on macOS, smoke-tested on Metal and published as the asset of the
# rolling pre-release `capital-latest`. Shots and CI logs go to the orphan branch `capital-shots`.
on:
  push:
    branches: ['claude/capital-game']
    paths: ['game/**', '.github/workflows/capital.yml', 'docs/status/capital-game.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capital-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_TAG }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v* godot && chmod +x godot
      - name: Import and test
        run: |
          set -o pipefail
          mkdir -p ci
          echo "${GITHUB_SHA::10}" > game/build_info.txt
          ~/godot/godot --headless --path game --import 2>&1 | tail -20 || true
          ~/godot/godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee ci/tests.log
          # Scripted play through the real game loop: ride, drive, fly, dropship, battle.
          # Full log kept as an artifact; the first script error is printed with its backtrace; a hang fails in
          # 12 minutes instead of eating the job (run 23: an error repeated every frame until the job timed out).
          timeout 720 ~/godot/godot --headless --path game -- --scenario all > ci/scenarios_full.log 2>&1 || echo "scenarios exit $?" >> ci/scenarios_full.log
          grep -E "^scenario|SCRIPT ERROR|^scenarios exit|vehicle destroyed" ci/scenarios_full.log | uniq -c | tee ci/scenarios.log
          grep -m1 -A14 "SCRIPT ERROR" ci/scenarios_full.log || true
          ! grep -q "FAIL\|SCRIPT ERROR\|scenarios exit" ci/scenarios.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-test
          path: ci/

  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_TAG }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v* godot && chmod +x godot
      - name: Install Vulkan (lavapipe) and xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb libvulkan1 > /dev/null
      - name: Shots shard ${{ matrix.shard }} (Vulkan on lavapipe)
        run: |
          ~/godot/godot --headless --path game --import > /dev/null 2>&1 || true
          mkdir -p ci/shots
          xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --path game --rendering-driver vulkan \
            --resolution 1280x720 -- --shots "$PWD/ci/shots" --preset High --scale 1 --shard ${{ matrix.shard }}/4 2>&1 \
            | grep -v ALSA | tee ci/shots_${{ matrix.shard }}.log || true
          ls -la ci/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-shots-${{ matrix.shard }}
          path: ci/

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-linux-${{ env.GODOT_TAG }}
      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q g.zip && rm g.zip && mv Godot_v* godot && chmod +x godot
      - name: Install Vulkan (lavapipe) and xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb libvulkan1 > /dev/null
      - name: Smoke (60 s of play, renders)
        run: |
          ~/godot/godot --headless --path game --import > /dev/null 2>&1 || true
          mkdir -p ci
          xvfb-run -a -s "-screen 0 1920x1080x24" timeout 900 ~/godot/godot --path game --rendering-driver vulkan \
            --resolution 960x540 -- --smoke 60 --preset Low 2>&1 | grep -v ALSA | tail -60 | tee ci/smoke.log
          grep -q "smoke: ok" ci/smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-smoke
          path: ci/

  publish:
    runs-on: ubuntu-24.04
    needs: [test, shots, smoke, mac]
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish shots to capital-shots
        run: |
          mkdir -p out/shots
          cp art/ci-shots-*/shots/*.png out/shots/ 2>/dev/null || true
          cp art/ci-shots-*/*.log art/ci-test/*.log art/ci-smoke/*.log out/ 2>/dev/null || true
          mkdir -p out/mac && cp art/mac-logs/* out/mac/ 2>/dev/null || true
          cd out
          {
            echo "# Alabaster CI shots"
            echo
            echo "Commit ${GITHUB_SHA::10} on ${GITHUB_REF_NAME}, $(date -u '+%Y-%m-%d %H:%M UTC'). Rendered with Mesa lavapipe (software Vulkan), Forward+, High preset at 1280x720. Jobs: test ${{ needs.test.result }}, shots ${{ needs.shots.result }}, smoke ${{ needs.smoke.result }}, mac ${{ needs.mac.result }} (logs in mac/)."
            echo
            echo '```'; tail -5 tests.log 2>/dev/null; cat scenarios.log 2>/dev/null; tail -3 smoke.log 2>/dev/null; echo '```'
            for f in shots/*.png; do n=$(basename "$f" .png); echo "### $n"; echo "![$n]($f)"; echo; done
          } > README.md
          git init -q -b capital-shots
          git config user.name "capital-ci"
          git config user.email "capital-ci@users.noreply.github.com"
          git add -A
          git commit -q -m "shots for ${GITHUB_SHA::10}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" capital-shots

  mac:
    runs-on: macos-15
    timeout-minutes: 45
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Cache Godot (macOS + templates)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-macos-${{ env.GODOT_TAG }}
      - name: Download Godot and the macOS export template
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL -o g.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_macos.universal.zip"
          unzip -q g.zip && rm g.zip
          curl -fsSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q -j t.tpz templates/macos.zip templates/version.txt -d templates && rm t.tpz
          ls -la ~/godot ~/godot/templates
      - name: Install export template
        run: |
          T="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T" && cp ~/godot/templates/* "$T/"
      - name: Export Alabaster.app (arm64, ad-hoc signed)
        run: |
          echo "${GITHUB_SHA::10}" > game/build_info.txt
          G=~/godot/Godot.app/Contents/MacOS/Godot
          $G --headless --path game --import 2>&1 | tail -5 || true
          mkdir -p game/build
          $G --headless --path game --export-release "macOS" build/Alabaster.app 2>&1 | tail -30
          cd game/build
          test -d Alabaster.app/Contents/MacOS || { echo "export failed"; exit 1; }
          # The official template is universal: keep only the Apple Silicon slice.
          for b in Alabaster.app/Contents/MacOS/*; do lipo "$b" -thin arm64 -output "$b.arm64" && mv "$b.arm64" "$b"; done
          # The pad bridge for GIP pads macOS has no driver for (PowerA 20D6:2074); a build error must not
          # block the release, so it is reported and skipped.
          if clang -O2 -fobjc-arc -arch arm64 -mmacosx-version-min=13.0 ../tools/padbridge/main.m -o Alabaster.app/Contents/MacOS/padbridge -framework Foundation -framework IOKit -framework IOUSBHost 2> ../../ci-padbridge.log; then
            echo "padbridge built"; else echo "padbridge FAILED to build:"; cat ../../ci-padbridge.log; fi
          codesign --force --deep -s - Alabaster.app
          codesign -dv Alabaster.app 2>&1 | head -5
          lipo -info Alabaster.app/Contents/MacOS/* || true
          ditto -c -k --keepParent Alabaster.app ../../Alabaster-macos-arm64.zip
          ls -la ../../Alabaster-macos-arm64.zip
      - name: Metal smoke test, pad check and a short benchmark
        run: |
          mkdir -p ci
          A=game/build/Alabaster.app/Contents/MacOS/Alabaster
          $A --windowed --resolution 1280x720 -- --smoke 40 > ci/mac_smoke.log 2>&1 || echo "smoke exit $?" >> ci/mac_smoke.log
          tail -40 ci/mac_smoke.log
          $A --windowed --resolution 1280x720 -- --padcheck > ci/mac_padcheck.log 2>&1 || true
          tail -5 ci/mac_padcheck.log
          $A --windowed --resolution 1280x720 -- --benchmark --preset High > ci/mac_benchmark.log 2>&1 || echo "benchmark exit $?" >> ci/mac_benchmark.log
          tail -12 ci/mac_benchmark.log
          cp ~/Library/Logs/CapitalGame/game.log ci/mac_game.log 2>/dev/null || true
          cp ~/Library/Logs/CapitalGame/benchmark.json ci/ 2>/dev/null || true
          cp ci-padbridge.log ci/ 2>/dev/null || true
          grep -q "smoke: ok" ci/mac_smoke.log
      - name: Publish to the capital-latest pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}:refs/tags/capital-latest"
          NOTES="Alabaster ${GITHUB_SHA::10} ($(date -u '+%Y-%m-%d %H:%M UTC')). Apple Silicon, ad-hoc signed. Fetch: curl -L -o Alabaster.zip https://github.com/${GITHUB_REPOSITORY}/releases/download/capital-latest/Alabaster-macos-arm64.zip && ditto -x -k Alabaster.zip . && xattr -dr com.apple.quarantine Alabaster.app"
          if gh release view capital-latest > /dev/null 2>&1; then
            gh release edit capital-latest --prerelease --title "Alabaster (latest)" --notes "$NOTES"
          else
            gh release create capital-latest --prerelease --title "Alabaster (latest)" --notes "$NOTES" --target "${GITHUB_SHA}"
          fi
          gh release upload capital-latest Alabaster-macos-arm64.zip --clobber
          gh release upload capital-latest ci/benchmark.json --clobber 2>/dev/null || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-logs
          path: ci/
