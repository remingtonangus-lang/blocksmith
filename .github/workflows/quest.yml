name: quest
# Meta Quest 3 build of Blocksmith (quest/): the shared Swift game cross-compiled with the Swift SDK for Android,
# a Vulkan + OpenXR renderer, packaged as a sideloadable debug APK.
#   1. Host checks: quest/tools/linux-check.sh builds the shared code + Quest sources for Linux and runs questcheck
#      (world gen, meshing, Game.tick with Touch-pad input, mixer, saves) and a stereo render on lavapipe.
#   2. APK: quest/tools/build-apk.sh (Swift 6.4.0 + Android SDK bundle, NDK r30, Khronos OpenXR loader).
#   3. Delivery: the APK as an artifact, and force-pushed alone (blocksmith-quest.apk + BUILD.txt) to the branch
#      `quest-dist` for the Mac's adb monitor.
on:
  push:
    branches: ['claude/quest-port']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quest-${{ github.ref }}
  cancel-in-progress: true

env:
  SWIFT_VERSION: '6.4.0'
  SWIFT_SDK: 'swift-6.4.0-RELEASE_android'
  SWIFT_SDK_URL: 'https://download.swift.org/swift-6.4.0-release/android-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_android.artifactbundle.tar.gz'
  SWIFT_SDK_SHA: '21fb555122a3d801ad943d48df7ebffdd8824de61c25c180bb792d3edaee0b43'
  SWIFT_URL: 'https://download.swift.org/swift-6.4.0-release/ubuntu2404/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-ubuntu24.04.tar.gz'
  NDK_URL: 'https://dl.google.com/android/repository/android-ndk-r30-Linux.zip'

jobs:
  host:
    # Shared code + Quest sources built for Linux: questcheck (world, meshing, Game.tick with Touch input, mixer, saves),
    # a stereo render and the scripted VR controls test on lavapipe.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/swift
            ~/.swiftpm/swift-sdks
            ~/.config/swiftpm/swift-sdks
            ~/ndk
          key: quest-tools-swift6.4.0-ndk-r30-v1

      - name: Swift toolchain
        run: |
          if [ ! -x "$HOME/swift/usr/bin/swift" ]; then
            mkdir -p "$HOME/swift"
            curl -fsSL "$SWIFT_URL" | tar -xz -C "$HOME/swift" --strip-components=1
          fi
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
          "$HOME/swift/usr/bin/swift" --version

      - name: Android NDK r30
        run: |
          if [ ! -d "$HOME/ndk/android-ndk-r30" ]; then
            mkdir -p "$HOME/ndk"; curl -fsSL -o /tmp/ndk.zip "$NDK_URL"; unzip -q /tmp/ndk.zip -d "$HOME/ndk"; rm /tmp/ndk.zip
          fi
          # Every NDK variable points at r30: the runner's own NDK (ANDROID_NDK_ROOT = 27.x) lacks the libc++ symbols the
          # Swift SDK's runtime was built against (std::__hash_memory: run 5).
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME; do echo "$v=$HOME/ndk/android-ndk-r30" >> "$GITHUB_ENV"; done

      - name: OpenXR loader
        run: quest/tools/fetch-openxr.sh && mkdir -p build/openxr && unzip -q -o build/openxr_loader.aar -d build/openxr

      - name: Host packages (Vulkan headers, lavapipe, zlib, OpenXR)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libvulkan-dev mesa-vulkan-drivers zlib1g-dev libopenxr-dev

      - name: Host checks (questcheck + stereo render + VR controls sim on lavapipe)
        env:
          OPENXR_INCLUDE: ${{ github.workspace }}/build/openxr/prefab/modules/headers/include
        run: |
          export GLSLC=$(ls "$ANDROID_NDK_HOME"/shader-tools/*/glslc | head -1)
          quest/tools/linux-check.sh build 2>&1 | grep -E "error|warning: unre" | head -50 || true
          test -x build/quest-linux/questcheck
          mkdir -p build/quest-out
          BLOCKSMITH_TEXRES=32 ./build/quest-linux/questcheck --render build/quest-out/stereo.png --questsim build/quest-out/vrsim.png 2>&1 | tee build/quest-out/questcheck.log
          grep -q "all checks passed" build/quest-out/questcheck.log

      - name: Upload host results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest-host-${{ github.run_number }}
          path: build/quest-out/
          if-no-files-found: warn

  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/swift
            ~/.swiftpm/swift-sdks
            ~/.config/swiftpm/swift-sdks
            ~/ndk
          key: quest-tools-swift6.4.0-ndk-r30-v1

      - name: Swift toolchain
        run: |
          if [ ! -x "$HOME/swift/usr/bin/swift" ]; then
            mkdir -p "$HOME/swift"
            curl -fsSL "$SWIFT_URL" | tar -xz -C "$HOME/swift" --strip-components=1
          fi
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
          "$HOME/swift/usr/bin/swift" --version

      - name: Android NDK r30
        run: |
          if [ ! -d "$HOME/ndk/android-ndk-r30" ]; then
            mkdir -p "$HOME/ndk"; curl -fsSL -o /tmp/ndk.zip "$NDK_URL"; unzip -q /tmp/ndk.zip -d "$HOME/ndk"; rm /tmp/ndk.zip
          fi
          # Every NDK variable points at r30: the runner's own NDK (ANDROID_NDK_ROOT = 27.x) lacks the libc++ symbols the
          # Swift SDK's runtime was built against (std::__hash_memory: run 5).
          for v in ANDROID_NDK_HOME ANDROID_NDK_ROOT ANDROID_NDK ANDROID_NDK_LATEST_HOME; do echo "$v=$HOME/ndk/android-ndk-r30" >> "$GITHUB_ENV"; done

      - name: OpenXR loader
        run: quest/tools/fetch-openxr.sh && mkdir -p build/openxr && unzip -q -o build/openxr_loader.aar -d build/openxr

      - name: Swift SDK for Android
        run: |
          if ! swift sdk list | grep -q "$SWIFT_SDK"; then
            swift sdk install "$SWIFT_SDK_URL" --checksum "$SWIFT_SDK_SHA"
          fi
          swift sdk list
          S=$(find "$HOME/.swiftpm/swift-sdks" "$HOME/.config/swiftpm/swift-sdks" -name 'setup-android-sdk.sh' 2>/dev/null | head -1 || true)
          if [ -n "$S" ]; then echo "running $S"; bash "$S"; fi

      - name: Build APK
        env:
          OPENXR_AAR: build/openxr_loader.aar
        run: |
          export VERSION_CODE=${{ github.run_number }}
          mkdir -p build/quest-out
          quest/tools/build-apk.sh build/quest-out/blocksmith-quest.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blocksmith-quest-${{ github.run_number }}
          path: |
            build/quest-out/
            build/quest-swift-build.log
          if-no-files-found: warn

  publish:
    # The APK alone on `quest-dist` (blocksmith-quest.apk + BUILD.txt) for the Mac's adb monitor, once both jobs pass.
    needs: [host, apk]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: quest/MILESTONE
      - uses: actions/download-artifact@v4
        with:
          name: blocksmith-quest-${{ github.run_number }}
          path: dl
      - name: Publish to quest-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find dl -name blocksmith-quest.apk | head -1)
          test -n "$APK"
          mkdir -p /tmp/dist && cp "$APK" /tmp/dist/blocksmith-quest.apk
          echo "commit ${GITHUB_SHA::7} milestone $(cat quest/MILESTONE) run ${{ github.run_id }} versionCode ${{ github.run_number }} built $(date -u +%Y-%m-%dT%H:%MZ)" > /tmp/dist/BUILD.txt
          cd /tmp/dist
          git init -q; git checkout -q --orphan quest-dist; git add -A
          git -c user.name="blocksmith-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Quest APK for ${GITHUB_SHA::7} (run ${{ github.run_id }})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" quest-dist
          cat BUILD.txt
