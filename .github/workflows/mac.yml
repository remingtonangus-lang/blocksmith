name: mac
# Builds Blocksmith on an Apple Silicon runner, renders the headless snapshots and
# publishes them (plus build/snap logs) to the orphan branch `ci-snaps-<branch>` (slashes -> dashes), overwritten
# each run; runs of the main line (claude/eloquent-lovelace-bsc5v1) also update `ci-snaps`.
# View: https://github.com/<owner>/blocksmith/tree/ci-snaps  (README.md shows every image)
on:
  push:
    branches-ignore: ['ci-snaps', 'ci-snaps-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers; uname -m
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcrun swiftc --version

      - name: Build
        id: build
        run: |
          set -o pipefail
          EXTRA_SWIFTC_FLAGS="-Xfrontend -warn-long-expression-type-checking=150" bash ./build.sh 2>&1 | tee build.log

      - name: Type-check time gate (expressions that could time out on an M1 with a newer Swift)
        if: always() && steps.build.outcome == 'success'
        run: |
          # Report every expression over 150 ms; fail on any over 600 ms (the Mac hit the hard limit on
          # one of these; the CI VM type-checks about twice as slowly as an M1, so 600 ms here is ~300 ms there).
          grep -E "warning: expression took [0-9]+ms to type-check" build.log | sort -u | tee typecheck.log || true
          slow=$(grep -oE "expression took [0-9]+ms" typecheck.log | grep -oE "[0-9]+" | awk '$1 >= 600' | wc -l | tr -d ' ')
          echo "type-check: $(wc -l < typecheck.log | tr -d ' ') expressions over 150 ms, $slow over 600 ms"
          [ "$slow" -eq 0 ]

      - name: Smoke test (play 60 s at render distance 8, 16, 24, and 24 in Fast)
        id: smoke
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -o pipefail
          bash ./smoke.sh 60 2>&1 | tee smoke.log

      - name: Benchmarks
        id: bench
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 12
        run: |
          set -o pipefail
          bash ./bench.sh 2>&1 | tee bench.log

      - name: Debug rerun of a crashed benchmark scene
        if: always() && steps.bench.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          S=$(grep -E 'Segmentation fault|Abort trap|Illegal instruction|Trace/BPT trap|Bus error' bench.log | head -1 || true)
          [ -n "$S" ] || { echo "benchmarks failed without a crash (see compare)"; exit 0; }
          # The crashed scene is the one after the last scene that finished.
          SCENE=$(grep -o 'bench: [a-z0-9]* took' bench.log | tail -1 | awk '{print $2}')
          case "$SCENE" in flight8) NEXT=flight16;; flight16) NEXT=flight24;; fluids) NEXT=flight8;; *) NEXT=flight8;; esac
          bash ./build.sh debug > debugbuild.log 2>&1 || { echo "debug build failed:"; grep -E "error|ld:|Undefined|duplicate|symbol" debugbuild.log | head -60; tail -20 debugbuild.log; }
          echo "rerun (debug build) of bench scene $NEXT" > benchdebug.log
          lldb --batch -o run -o 'bt 40' -o 'thread backtrace all' -- build/Blocksmith.app/Contents/MacOS/Blocksmith \
            --bench snaps/bench_debug.json --scenes "$NEXT" >> benchdebug.log 2>&1 || true
          grep -v '^bench flight' benchdebug.log | tail -150
          bash ./build.sh 2>&1 | tail -1

      - name: Profile (sample)
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          bash perf/profile.sh flight16 10 2>&1 | tee profile.log
          bash perf/profile.sh meshprof 8 2>&1 | tee -a profile.log
          bash perf/profile.sh genprof 8 2>&1 | tee -a profile.log

      - name: Playthrough (progression tests)
        id: play
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 20
        run: |
          set -o pipefail
          build/Blocksmith.app/Contents/MacOS/Blocksmith --playthrough 2>&1 | tee playthrough.log

      - name: Snapshots
        id: snap
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 25
        run: |
          set -o pipefail
          bash ./snap.sh 2>&1 | tee snap.log

      - name: Terrain check
        id: terrain
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -o pipefail
          build/Blocksmith.app/Contents/MacOS/Blocksmith --terrainmap snaps/check --step 32 --strict 2>&1 | tee terrain.log

      - name: Debug rerun of the failing shot
        if: failure() && steps.snap.outcome == 'failure'
        timeout-minutes: 10
        run: |
          L=$(grep -o 'snap.sh: line [0-9]*' snap.log | tail -1 | grep -o '[0-9]*$' || true)
          bash ./build.sh debug > debugbuild.log 2>&1 || { echo "debug build failed:"; grep -E "error|ld:|Undefined|duplicate|symbol" debugbuild.log | head -60; tail -20 debugbuild.log; }
          BIN=build/Blocksmith.app/Contents/MacOS/Blocksmith
          mkdir -p snaps
          CMD=$(sed -n "${L:-10}p" snap.sh)
          echo "rerun (debug build): $CMD" > debug.log
          ARGS=${CMD#\"\$BIN\" }
          (eval "lldb --batch -o run -o 'bt 40' -- \"$BIN\" $ARGS") >> debug.log 2>&1 || true
          tail -80 debug.log

      - name: Publish to ci-snaps
        if: always()
        continue-on-error: true     # parallel branches race for the shared ci-snaps ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SNAP_OUTCOME: ${{ steps.snap.outcome }}
          BENCH_OUTCOME: ${{ steps.bench.outcome }}
          PLAY_OUTCOME: ${{ steps.play.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          PUB="$RUNNER_TEMP/pub"
          rm -rf "$PUB"; mkdir -p "$PUB"
          cp snaps/*.png "$PUB/" 2>/dev/null || true
          if [ -d snaps/sounds ]; then cp -r snaps/sounds "$PUB/sounds"; fi
          cp build.log typecheck.log debugbuild.log smoke.log snap.log debug.log benchdebug.log bench.log profile.log playthrough.log terrain.log snaps/bench.json snaps/bench.md snaps/profile_*.txt "$PUB/" 2>/dev/null || true
          cd "$PUB"
          {
            echo "# Blocksmith CI snapshots"
            echo
            echo "Commit \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\` — build: **${BUILD_OUTCOME}**, smoke: **${SMOKE_OUTCOME}**, benchmarks: **${BENCH_OUTCOME}**, playthrough: **${PLAY_OUTCOME}**, snapshots: **${SNAP_OUTCOME}**"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            tail -n 80 snap.log 2>/dev/null || true
            echo '```'
            if [ -f bench.md ]; then
              echo "### Benchmarks (vs perf/baseline.json)"
              echo '```'
              grep '^bench' bench.log 2>/dev/null || true
              echo '```'
              cat bench.md
            fi
            if [ -f smoke.log ]; then
              echo "### Smoke test"
              echo '```'
              grep -E '^smoke' smoke.log | tail -n 20
              echo '```'
            fi
            if [ -f playthrough.log ]; then
              echo "### Playthrough"
              echo '```'
              grep -E '^(PASS|FAIL|INFO|----|playthrough)' playthrough.log | tail -n 150
              echo '```'
            fi
            if [ -d sounds ]; then
              echo "### Synthesized sounds"
              for f in sounds/*.wav; do echo "- [${f#sounds/}](${f})"; done
            fi
            for f in *.png; do
              [ -e "$f" ] || continue
              echo "### ${f%.png}"
              echo "![${f}](${f})"
            done
          } > README.md
          git init -q
          git checkout -q --orphan ci-snaps
          git add -A
          git -c user.name="blocksmith-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Snapshots for ${GITHUB_SHA}"
          SNAPS="ci-snaps-${GITHUB_REF_NAME//\//-}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "ci-snaps:${SNAPS}"
          if [ "${GITHUB_REF_NAME}" = "claude/eloquent-lovelace-bsc5v1" ]; then
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snaps
          fi

      - name: Report
        if: always()
        run: |
          echo "== build errors"; grep -E "error:" build.log | head -20 || true
          echo "== playthrough"; grep -E "^(PASS|FAIL|INFO|----|playthrough)|Fatal|fatal error" playthrough.log | cut -c1-220 | tail -n 170 || true
          echo "== snapshots"; grep -E "Fatal|fatal error|Abort|Segmentation" snap.log | head -10 || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snaps
          path: |
            snaps/*.png
            snaps/sounds/*.wav
            snaps/bench.json
            snaps/bench.md
            snaps/profile_*.txt
            bench.log
            profile.log
            build.log
            smoke.log
            snap.log
            playthrough.log
          if-no-files-found: ignore
