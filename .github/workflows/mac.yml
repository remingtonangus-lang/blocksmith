name: mac
# Builds Blocksmith on an Apple Silicon runner, renders the headless snapshots and
# publishes them (plus build/snap logs) to the orphan branch `ci-snaps`, overwritten each run.
# View: https://github.com/<owner>/blocksmith/tree/ci-snaps  (README.md shows every image)
on:
  push:
    branches-ignore: [ci-snaps]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers; uname -m
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcrun swiftc --version

      - name: Build
        id: build
        run: |
          set -o pipefail
          bash ./build.sh 2>&1 | tee build.log

      - name: Snapshots
        id: snap
        run: |
          set -o pipefail
          bash ./snap.sh 2>&1 | tee snap.log

      - name: Publish to ci-snaps
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SNAP_OUTCOME: ${{ steps.snap.outcome }}
        run: |
          PUB="$RUNNER_TEMP/pub"
          rm -rf "$PUB"; mkdir -p "$PUB"
          cp snaps/*.png "$PUB/" 2>/dev/null || true
          cp build.log snap.log "$PUB/" 2>/dev/null || true
          cd "$PUB"
          {
            echo "# Blocksmith CI snapshots"
            echo
            echo "Commit \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\` — build: **${BUILD_OUTCOME}**, snapshots: **${SNAP_OUTCOME}**"
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            tail -n 80 snap.log 2>/dev/null || true
            echo '```'
            for f in *.png; do
              [ -e "$f" ] || continue
              echo "### ${f%.png}"
              echo "![${f}](${f})"
            done
          } > README.md
          git init -q
          git checkout -q --orphan ci-snaps
          git add -A
          git -c user.name="blocksmith-ci" -c user.email="ci@users.noreply.github.com" commit -qm "Snapshots for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snaps

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snaps
          path: |
            snaps/*.png
            build.log
            snap.log
          if-no-files-found: ignore
